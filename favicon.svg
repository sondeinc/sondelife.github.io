<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sonde brand mark — Voyager probe silhouette.

  Geometry matches the inline probe group in web/sonde-life/arrival.html
  (rotate(-40), identical boom lengths, dish curve, bus polygon).
  Canonical instance of the mark; any other surface that needs the probe
  should either reference this file or inline the same shapes.

  Fills use currentColor by default so an <img> or <object> host adopts
  the parent text color. Inlining in teaser HTML is preferred when the
  host needs per-part theming via --sonde-color-* CSS variables.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -36 76 68" role="img" aria-label="Sonde probe mark">
  <style>
    /* Standalone favicon context has no inherited color, so currentColor would
       resolve to user-agent default (often invisible on tinted tab bars). Pin
       a brand violet that reads on both light and dark browser chrome. The
       dark value mirrors --sonde-color-primary in packages/themes/tokens.css;
       SVGs loaded as favicons cannot read CSS custom properties from the host
       page, so this duplication is unavoidable — keep in sync if the token
       palette changes. */
    :root { color: #b185ff; }
    @media (prefers-color-scheme: light) { :root { color: #6d3fff; } }
  </style>
  <g transform="rotate(-40)">
    <!-- magnetometer boom + tip -->
    <line x1="-6" y1="-1.5" x2="-32" y2="-8" stroke="currentColor" stroke-width="0.95" stroke-linecap="round"/>
    <circle cx="-32" cy="-8" r="1.8" fill="currentColor"/>
    <!-- RTG boom + radiator body + fins -->
    <line x1="-6" y1="3" x2="-25" y2="12" stroke="currentColor" stroke-width="1.3"/>
    <g transform="translate(-25, 12) rotate(20)">
      <rect x="-3" y="-6" width="6" height="12" rx="0.8" fill="currentColor" stroke="currentColor" stroke-width="0.65"/>
      <line x1="-3" y1="-3" x2="3" y2="-3" stroke="currentColor" stroke-width="0.45"/>
      <line x1="-3" y1="0"  x2="3" y2="0"  stroke="currentColor" stroke-width="0.45"/>
      <line x1="-3" y1="3"  x2="3" y2="3"  stroke="currentColor" stroke-width="0.45"/>
    </g>
    <!-- science platform -->
    <line x1="-3" y1="-8" x2="-9" y2="-18" stroke="currentColor" stroke-width="1.1"/>
    <rect x="-14" y="-22" width="10" height="6" rx="1" fill="currentColor" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="-8" cy="-19" r="1.9" fill="currentColor"/>
    <!-- dish -->
    <path d="M9,-22 Q25,-16 25,0 Q25,16 9,22" fill="currentColor" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M11,-18 Q22,-12 22,0 Q22,12 11,18" fill="currentColor" opacity="0.35"/>
    <line x1="11" y1="-10" x2="21" y2="0" stroke="currentColor" stroke-width="0.8"/>
    <line x1="11" y1="10"  x2="21" y2="0" stroke="currentColor" stroke-width="0.8"/>
    <line x1="9"  y1="0"   x2="21" y2="0" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="21" cy="0" r="2.9" fill="currentColor"/>
    <!-- bus -->
    <polygon points="-3,-8 9,-8 12,-5 12,5 9,8 -3,8 -6,5 -6,-5" fill="currentColor" stroke="currentColor" stroke-width="1.1"/>
    <!-- nozzle -->
    <path d="M-8,-3 L-12,-5 L-12,5 L-8,3 Z" fill="currentColor" stroke="currentColor" stroke-width="0.7"/>
  </g>
</svg>
