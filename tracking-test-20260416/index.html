<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonde tracking harness V3 (Fixed Paths)</title>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "07871f5aa9e44ce2b83a37f8924fb4a6", "spa": true}'></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1018;
    color: #F5F0EB;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 3rem 2rem;
    max-width: 760px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; color: #DDAA33; margin-bottom: 1rem; }
  .note {
    font-size: 0.82rem;
    color: rgba(245, 240, 235, 0.7);
    padding: 1rem;
    border: 1px solid #DDAA33;
    border-radius: 4px;
    margin-bottom: 2rem;
  }
  ol.buttons { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
  button {
    background: rgba(221, 170, 51, 0.1);
    border: 1px solid #DDAA33;
    color: white;
    padding: 1rem;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
  }
  #log {
    margin-top: 2rem;
    padding: 1rem;
    background: black;
    color: #00ff00;
    font-family: monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>Sonde tracking harness V3 (Fixed Paths)</h1>
  <p>V3 fixes the nesting issue. Each button now pushes a clean, distinct path relative to the root.</p>
  
  <ol class="buttons">
    <li><button id="p1">Step 1: pushState <code>/tracking-test-20260416/step-1/</code></button></li>
    <li><button id="p2">Step 2: pushState <code>/tracking-test-20260416/step-2/</code></button></li>
    <li><button id="p3">Step 3: pushState <code>/tracking-test-20260416/step-3/</code></button></li>
    <li><button id="p4">Step 4: pushState <code>/tracking-test-20260416/step-4/</code> + query</button></li>
    <li><button id="p5">Step 5: Race test (50ms) -> navigate to root</button></li>
    <li><button id="p6">Step 6: Race test (200ms) -> navigate to root</button></li>
  </ol>

  <pre id="log"></pre>

  <script>
    var logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += new Date().toISOString().slice(11, 19) + ' ' + msg + '\n' + window.location.href + '\n\n';
    }

    function push(pathName) {
      const fullPath = '/tracking-test-20260416/' + pathName;
      history.pushState({}, '', fullPath);
      log('Pushed: ' + fullPath);
    }

    document.getElementById('p1').onclick = () => push('step-1/');
    document.getElementById('p2').onclick = () => push('step-2/');
    document.getElementById('p3').onclick = () => push('step-3/');
    document.getElementById('p4').onclick = () => push('step-4/?t=' + Date.now());
    
    document.getElementById('p5').onclick = () => {
      push('race-fast/');
      setTimeout(() => { window.location.href = 'https://sonde.life/'; }, 50);
    };

    document.getElementById('p6').onclick = () => {
      push('race-slow/');
      setTimeout(() => { window.location.href = 'https://sonde.life/'; }, 200);
    };
  </script>
</body>
</html>
